<svg viewBox="0 0 130 130" width="130" height="130" xmlns="http://www.w3.org/2000/svg" aria-label="HICKS, icône">

  <rect width="130" height="130" fill="#04382A" rx="20"/>
  <!-- Flux champagne, passe au-dessus -->
  <line x1="30" y1="30" x2="100" y2="100" stroke="#F8E7C9" stroke-width="13" stroke-linecap="round"/>
  <!-- Flux blanc, interrompu au centre : il passe dessous -->
  <line x1="100" y1="30" x2="80" y2="50" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="30" y2="100" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <!-- Nœud de décision -->
  <circle cx="65" cy="65" r="8.5" fill="#04382A" stroke="#FFFFFF" stroke-width="3.5"/>

</svg>
