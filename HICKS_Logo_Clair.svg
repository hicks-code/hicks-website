<svg viewBox="0 0 520 160" width="520" height="160" xmlns="http://www.w3.org/2000/svg" aria-label="HICKS Digital Advisory — logo version claire">

  <!-- Fond blanc -->
  <rect width="520" height="160" fill="#FFFFFF"/>

  <!-- ── Icône X ── -->
  <g transform="translate(20, 15)">
    <rect width="130" height="130" fill="#0F1E3D" rx="14"/>
    <!-- Diagonale coral ↘ -->
    <line x1="32" y1="32" x2="98" y2="98" stroke="#FF6B47" stroke-width="11" stroke-linecap="round"/>
    <!-- Diagonale blanche ↗ -->
    <line x1="98" y1="32" x2="32" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    <!-- Cercle central -->
    <circle cx="65" cy="65" r="7" fill="#0F1E3D" stroke="#FF6B47" stroke-width="2.5"/>
  </g>

  <!-- ── Wordmark ── -->
  <text x="175" y="90"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="58"
        fill="#0F1E3D"
        letter-spacing="-1">HICKS</text>
  <text x="177" y="125"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="400"
        font-size="14"
        fill="#5a6378"
        letter-spacing="3.5">DIGITAL ADVISORY</text>

</svg>
