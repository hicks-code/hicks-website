<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #04382A;
    font-family: 'Hanken Grotesk', -apple-system, sans-serif;
    position: relative; color: #F5F6FA;
  }
  .glow {
    position: absolute; top: -180px; right: -160px;
    width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(248,231,201,.14) 0%, rgba(248,231,201,.04) 38%, transparent 66%);
  }
  .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #F8E7C9; }
  .frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 84px; }
  .col-left { position: relative; z-index: 2; max-width: 640px; }
  .lockup { display: flex; align-items: center; gap: 16px; margin-bottom: 44px; }
  .lockup svg { width: 64px; height: 64px; }
  .lockup .name { font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 1.9rem; letter-spacing: 0.06em; color: #FFFFFF; line-height: 1; }
  .lockup .sub { font-family: 'Hanken Grotesk', sans-serif; font-size: 0.78rem; letter-spacing: 0.18em; color: #F8E7C9; text-transform: uppercase; font-weight: 500; }
  h1 { font-family: 'Schibsted Grotesk', sans-serif; font-weight: 800; font-size: 3.1rem; line-height: 1.1; letter-spacing: -0.03em; }
  h1 .coral { color: #F8E7C9; display: block; }
  .cred { margin-top: 40px; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 500; font-size: 1.05rem; color: #93A29B; }
  .col-right { position: relative; z-index: 1; flex-shrink: 0; }
  .col-right svg { width: 340px; height: 340px; filter: drop-shadow(0 10px 50px rgba(248,231,201,0.22)); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="accent-line"></div>
  <div class="frame">
    <div class="col-left">
      <div class="lockup">
        <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <rect width="130" height="130" rx="26" fill="#064E3B"/>
          <line x1="34" y1="34" x2="96" y2="96" stroke="#F8E7C9" stroke-width="13" stroke-linecap="round"/>
          <line x1="96" y1="34" x2="78" y2="52" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
          <line x1="52" y1="78" x2="34" y2="96" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
          <circle cx="65" cy="65" r="8.5" fill="#04382A" stroke="#FFFFFF" stroke-width="3.5"/>
        </svg>
        <div>
          <div class="name">HICKS</div>
          <div class="sub">Advisory</div>
        </div>
      </div>
      <h1>L'IA reprend le travail répétitif.<span class="coral">Vous reprenez le temps pour votre métier.</span></h1>
      <p class="cred">Xavier Bottex · Automatisation IA pour PME</p>
    </div>
    <div class="col-right">
      <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
        <line x1="30" y1="30" x2="100" y2="100" stroke="#F8E7C9" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="30" x2="79" y2="51" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
        <line x1="51" y1="79" x2="30" y2="100" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
        <circle cx="65" cy="65" r="9.5" fill="#04382A" stroke="#FFFFFF" stroke-width="4"/>
      </svg>
    </div>
  </div>
</body>
</html>
