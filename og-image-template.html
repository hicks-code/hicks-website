<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0A1428;
    font-family: 'Hanken Grotesk', -apple-system, sans-serif;
    position: relative; color: #F5F6FA;
  }
  .glow {
    position: absolute; top: -180px; right: -160px;
    width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(255,107,71,.14) 0%, rgba(255,107,71,.04) 38%, transparent 66%);
  }
  .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #FF6B47; }
  .frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 84px; }
  .col-left { position: relative; z-index: 2; max-width: 640px; }
  .lockup { display: flex; align-items: center; gap: 16px; margin-bottom: 44px; }
  .lockup svg { width: 64px; height: 64px; }
  .lockup .name { font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 1.9rem; letter-spacing: 0.06em; color: #FFFFFF; line-height: 1; }
  .lockup .sub { font-family: 'Hanken Grotesk', sans-serif; font-size: 0.78rem; letter-spacing: 0.18em; color: #FF6B47; text-transform: uppercase; font-weight: 500; }
  h1 { font-family: 'Schibsted Grotesk', sans-serif; font-weight: 800; font-size: 3.1rem; line-height: 1.1; letter-spacing: -0.03em; }
  h1 .coral { color: #FF6B47; display: block; }
  .cred { margin-top: 40px; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 500; font-size: 1.05rem; color: #8892A4; }
  .col-right { position: relative; z-index: 1; flex-shrink: 0; }
  .col-right svg { width: 340px; height: 340px; filter: drop-shadow(0 10px 50px rgba(255,107,71,0.22)); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="accent-line"></div>
  <div class="frame">
    <div class="col-left">
      <div class="lockup">
        <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <rect width="130" height="130" rx="26" fill="#0F1E3D"/>
          <circle cx="65" cy="65" r="44" fill="none" stroke="#FFFFFF" stroke-width="2"/>
          <circle cx="94.4" cy="32.3" r="3.6" fill="#FFFFFF"/>
          <line x1="44" y1="44" x2="86" y2="86" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
          <line x1="86" y1="44" x2="44" y2="86" stroke="#FF6B47" stroke-width="9" stroke-linecap="round"/>
          <circle cx="65" cy="65" r="7" fill="#0F1E3D" stroke="#FFFFFF" stroke-width="2"/>
        </svg>
        <div>
          <div class="name">HICKS</div>
          <div class="sub">Advisory</div>
        </div>
      </div>
      <h1>L'IA reprend le travail répétitif.<span class="coral">Vous reprenez le temps pour votre métier.</span></h1>
      <p class="cred">Xavier Bottex · Automatisation IA pour PME</p>
    </div>
    <div class="col-right">
      <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
        <circle cx="65" cy="65" r="56" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="102.5" cy="23.4" r="4.5" fill="#FFFFFF"/>
        <line x1="36" y1="36" x2="94" y2="94" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
        <line x1="94" y1="36" x2="36" y2="94" stroke="#FF6B47" stroke-width="12" stroke-linecap="round"/>
        <circle cx="65" cy="65" r="9" fill="#0A1428" stroke="#FFFFFF" stroke-width="2.5"/>
      </svg>
    </div>
  </div>
</body>
</html>
